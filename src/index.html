<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https://api.dexscreener.com https://api.geckoterminal.com; media-src 'self' data:" />
<title>Poison Terminal</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="fx-high">
  <!-- animated background -->
  <div id="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div class="grid-floor"></div>
    <div class="noise"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="edgeFlash" aria-hidden="true"></div>

  <!-- splash -->
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-logo"><div class="logo-mark big"><i></i><i></i><i></i></div></div>
      <div class="splash-title glitch" data-text="POISON">POISON</div>
      <div class="splash-sub">memecoin terminal</div>
      <div class="splash-bar"><span></span></div>
      <div class="splash-status" id="splashStatus">connecting to solana…</div>
    </div>
  </div>

  <header id="titlebar">
    <div class="brand">
      <div class="logo-mark"><i></i><i></i><i></i></div>
      <span class="logo-text glitch" data-text="POISON">POISON</span>
      <span class="mode-badge" id="modeBadge" title="Data source">LIVE</span>
    </div>
    <button class="search-trigger nodrag" id="searchBtn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search token, paste CA, or type <b>&gt;</b> for commands</span>
      <kbd id="searchKbd">Ctrl K</kbd>
    </button>
    <div class="tb-stats nodrag">
      <div class="tb-stat"><span>SOL</span><b id="solPrice">—</b></div>
      <div class="tb-stat"><span>Balance</span><b id="balance">—</b></div>
      <div class="tb-stat"><span>Portfolio</span><b id="portfolio">—</b></div>
      <div class="tb-stat"><span>Total PnL</span><b id="totalPnl">—</b></div>
    </div>
    <div class="tb-actions nodrag">
      <button class="tb-btn accent" id="pnlBtn" title="PnL card (P)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15l3-3 3 2 4-5"/></svg>PnL Card
      </button>
      <button class="tb-btn icon" id="helpBtn" title="Shortcuts (?)">⌨</button>
      <button class="tb-btn icon" id="settingsBtn" title="Settings (Ctrl ,)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="win-controls nodrag" id="winControls">
      <button id="wMin" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button id="wMax" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8"/></svg></button>
      <button id="wClose" class="close" title="Close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    </div>
  </header>

  <main id="layout">
    <!-- LEFT: discovery -->
    <aside id="left" class="panel glass enter" style="--d:0">
      <div class="tabs" id="listTabs">
        <button data-list="trending" class="active" title="Trending (T)">🔥 Hot</button>
        <button data-list="new" title="New pairs (N)">✨ New</button>
        <button data-list="surging" title="Surging 5m (G)">🚀 Surge</button>
        <button data-list="holdings" title="Your bags (H)">💼 Bags</button>
        <button data-list="watch" title="Watchlist (V)">★</button>
        <span class="tab-ink"></span>
      </div>
      <div class="list-tools">
        <div class="quickbuy" title="Amount for ⚡ quick-buy buttons in the list">
          <span>⚡</span><input id="quickBuyAmt" type="number" step="0.01" min="0" /><span class="unit">SOL</span>
        </div>
        <select id="listSort" title="Sort">
          <option value="default">Default</option>
          <option value="mc">Market cap</option>
          <option value="vol">Volume 1h</option>
          <option value="chg">Change 5m</option>
          <option value="age">Newest</option>
          <option value="liq">Liquidity</option>
        </select>
      </div>
      <div id="tokenList" class="token-list"></div>
    </aside>

    <!-- CENTER -->
    <section id="center">
      <div id="tokenHeader" class="panel glass enter" style="--d:1"></div>
      <div id="chartWrap" class="panel glass enter" style="--d:2">
        <div class="chart-toolbar">
          <div class="seg" id="tfSeg">
            <button data-tf="1">1s</button><button data-tf="60" class="active">1m</button><button data-tf="300">5m</button><button data-tf="900">15m</button><button data-tf="3600">1h</button>
          </div>
          <div class="seg" id="unitSeg"><button data-unit="mc" class="active">MCap</button><button data-unit="price">Price</button></div>
          <div class="chart-legend" id="chartLegend"></div>
          <div class="chart-hint">scroll = zoom · drag = pan · dbl-click = reset</div>
        </div>
        <div class="chart-box"><canvas id="chart"></canvas><div class="chart-loading" id="chartLoading"><div class="spinner"></div></div></div>
      </div>
      <div id="bottom" class="panel glass enter" style="--d:3">
        <div class="tabs small" id="bottomTabs">
          <button data-tab="trades" class="active">Live trades</button>
          <button data-tab="positions">Positions</button>
          <button data-tab="history">History</button>
          <span class="tab-ink"></span>
        </div>
        <div id="bottomBody" class="bottom-body"></div>
      </div>
    </section>

    <!-- RIGHT -->
    <aside id="right">
      <div id="tradePanel" class="panel glass enter" style="--d:1">
        <div class="side-toggle" id="sideToggle">
          <button data-side="buy" class="active">Buy</button>
          <button data-side="sell">Sell</button>
          <span class="side-ink"></span>
        </div>
        <div class="trade-body" id="tradeBody"></div>
      </div>
      <div id="positionPanel" class="panel glass enter" style="--d:2"></div>
      <div id="infoPanel" class="panel glass enter" style="--d:3"></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span class="dot" id="netDot"></span><span id="netText">connecting…</span>
    <span class="sep"></span><span id="latency">—</span>
    <span class="grow"></span>
    <span class="hint">Press <kbd>?</kbd> for shortcuts</span>
    <span class="sep"></span><span id="clock"></span>
  </footer>

  <div id="toasts"></div>
  <div id="modalRoot"></div>

  <script src="js/util.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/trading.js"></script>
  <script src="js/pnlcard.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
