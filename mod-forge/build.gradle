plugins {
    id 'java'
    id 'gg.essential.loom' version '0.10.0.5'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'gg.poison'
version = project.mod_version
base { archivesName = 'poison-client-forge-1.8.9' }

loom {
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
        mixinConfig 'mixins.poison.json'
    }
    mixin { defaultRefmapName = 'mixins.poison.refmap.json' }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
}

configurations {
    shadowImpl
    implementation.extendsFrom(shadowImpl)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
    // Forge 1.8.9 has no Mixin: ship 0.7.11 inside our jar and load it through the MixinTweaker
    shadowImpl('org.spongepowered:mixin:0.7.11-SNAPSHOT') { transitive = false }
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT'
}

// Minecraft 1.8.9 runs on Java 8
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand 'version': project.version }
}

tasks.named('jar') {
    manifest.attributes(
        'FMLCorePluginContainsFMLMod': 'true',
        'ForceLoadAsMod': 'true',
        'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        'MixinConfigs': 'mixins.poison.json',
        'TweakOrder': '0'
    )
}

tasks.named('shadowJar') {
    archiveClassifier = 'dev-all'
    configurations = [project.configurations.shadowImpl]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'LICENSE.txt'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ''
}
