<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Poison Wallet Tracker</title>
<meta name="theme-color" content="#07080b" />
<style>
:root{
  --bg:#07080b; --panel:#0e1015; --panel2:#13161d; --line:#1d212b; --line2:#272c38;
  --text:#e8ecf3; --muted:#7c8597; --dim:#4d5464;
  --green:#19e68c; --green-bg:rgba(25,230,140,.10);
  --red:#ff4d6a;  --red-bg:rgba(255,77,106,.10);
  --amber:#ffb547; --amber-bg:rgba(255,181,71,.10);
  --blue:#5aa9ff; --blue-bg:rgba(90,169,255,.10);
  --orange:#ff8a00;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.g{color:var(--green)} .r{color:var(--red)} .a{color:var(--amber)} .b{color:var(--blue)}

/* ---------- header ---------- */
header{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b0d12,#07080b)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .logo{width:24px;height:24px;border-radius:7px;background:conic-gradient(from 200deg,var(--orange),#ff3d00,var(--orange));box-shadow:0 0 18px rgba(255,138,0,.45)}
.brand small{color:var(--muted);font-weight:500}
.hstat{display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 0 rgba(25,230,140,.6);animation:pulse 1.6s infinite}
.dot.warn{background:var(--amber)} .dot.off{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,230,140,.55)}70%{box-shadow:0 0 0 7px rgba(25,230,140,0)}100%{box-shadow:0 0 0 0 rgba(25,230,140,0)}}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;font-weight:600;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:#3a4150;background:#181c25}
.btn.pri{background:var(--green);color:#03140b;border-color:transparent}
.btn.pri:hover{background:#3ff0a2}
.btn.on{border-color:rgba(25,230,140,.5);color:var(--green)}
.btn.sm{padding:4px 8px;font-size:11px;border-radius:7px}
.btn.demo.on{border-color:rgba(255,181,71,.55);color:var(--amber)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:290px minmax(0,1fr) 390px;height:calc(100% - 54px)}
.panel{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.panel:last-child{border-right:0}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:650;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph .count{font-family:var(--mono);color:var(--text);background:var(--panel2);border:1px solid var(--line2);padding:1px 7px;border-radius:999px;font-size:11px;letter-spacing:0}
.scroll{overflow-y:auto;min-height:0;flex:1}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#1e232d;border-radius:8px}

/* ---------- wallets ---------- */
.add{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.inp{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:#0a0c10;outline:none;font-size:12.5px}
.inp:focus{border-color:#3d4556}
.row{display:flex;gap:8px}
.chips{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;color:var(--muted);background:var(--panel)}
.chip.on{color:var(--text);border-color:#4a5263;background:var(--panel2)}
.wallet{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.wallet:hover{background:#0c0e13}
.wallet.flash{animation:wflash 1.2s ease-out}
@keyframes wflash{from{background:rgba(25,230,140,.14)}to{background:transparent}}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#06070a;flex:none}
.wmeta{min-width:0;flex:1}
.wname{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:5px;flex:none}
.tag.Insider{background:rgba(255,138,0,.13);color:#ffa940}
.tag.Trader{background:var(--blue-bg);color:var(--blue)}
.tag.KOL{background:rgba(196,120,255,.13);color:#c478ff}
.tag.Whale{background:rgba(25,230,200,.12);color:#19e6c8}
.wright{text-align:right;font-size:11.5px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}

/* ---------- center ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.feedbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line)}
.trade{display:grid;grid-template-columns:54px 128px 54px minmax(0,1fr) 100px 76px 64px;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.trade.new{animation:tin .5s ease-out}
.trade.BUY.new{animation:tinb 1.4s ease-out}
.trade.SELL.new{animation:tins 1.4s ease-out}
@keyframes tinb{from{background:rgba(25,230,140,.16)}to{background:transparent}}
@keyframes tins{from{background:rgba(255,77,106,.14)}to{background:transparent}}
@keyframes tin{from{opacity:0;transform:translateY(-4px)}}
.side{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-align:center;padding:3px 0;border-radius:6px}
.side.BUY{background:var(--green-bg);color:var(--green)}
.side.SELL{background:var(--red-bg);color:var(--red)}
.side.SWAP,.side.IN,.side.OUT{background:var(--blue-bg);color:var(--blue)}
.tok{display:flex;align-items:center;gap:8px;min-width:0}
.tok img,.tok .ph-img{width:22px;height:22px;border-radius:50%;flex:none;background:var(--panel2);object-fit:cover}
.tok b{white-space:nowrap;flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.tok .px{min-width:0;overflow:hidden;white-space:nowrap;font-size:11px}
.links{display:flex;gap:4px;justify-content:flex-end}
.lk{font-size:10.5px;padding:3px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
.lk:hover{color:var(--text);border-color:#3d4556}
.thead{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:7px 14px}

/* ---------- signals ---------- */
.sig{margin:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;transition:border-color .2s}
.sig.ENTER{border-color:rgba(25,230,140,.55);box-shadow:0 0 0 1px rgba(25,230,140,.15),0 8px 30px rgba(25,230,140,.08)}
.sig.LATE,.sig.WATCH{border-color:rgba(255,181,71,.30)}
.sig.AVOID,.sig.EXITED,.sig.DUMPING{opacity:.72}
.sig .top{display:flex;align-items:center;gap:10px;padding:11px 12px 8px}
.sig .top img,.sig .top .ph-img{width:34px;height:34px;border-radius:50%;background:var(--panel2);object-fit:cover;flex:none}
.sig .name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 9px;border-radius:7px;white-space:nowrap}
.state.ENTER{background:var(--green);color:#03140b;animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 16px rgba(25,230,140,.7)}}
.state.WATCH{background:var(--blue-bg);color:var(--blue)}
.state.LATE{background:var(--amber-bg);color:var(--amber)}
.state.AVOID,.state.EXITED,.state.DUMPING,.state.EXPIRED{background:var(--red-bg);color:var(--red)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sgrid div{background:var(--panel);padding:7px 9px}
.sgrid .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sgrid .v{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:1px}
.spark{display:block;width:100%;height:46px}
.meter{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:0 12px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .4s}
.reasons{padding:8px 12px;display:grid;gap:3px;font-size:11.5px}
.reasons div{display:flex;gap:7px}
.who{padding:0 12px 8px;display:flex;flex-wrap:wrap;gap:5px}
.who span{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2)}
.who span.sold{text-decoration:line-through;color:var(--red)}
.sact{display:flex;gap:6px;padding:0 12px 12px}
.sact .btn{flex:1;justify-content:center}

/* ---------- drawer / modal ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;z-index:40}
.veil.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line2);z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.dbody{padding:16px;overflow-y:auto;flex:1;display:grid;gap:16px;align-content:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h4{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:650}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.form .hint{font-size:11px;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex!important;grid-template-columns:none!important;align-items:center;gap:9px;color:var(--text)!important}
.toggle input{accent-color:var(--green);width:16px;height:16px}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:#11141b;border:1px solid var(--line2);box-shadow:0 12px 36px rgba(0,0,0,.6);animation:tin .25s ease-out;cursor:pointer}
.toast.ENTER{border-color:rgba(25,230,140,.6)}
.toast.SELL{border-color:rgba(255,77,106,.5)}
.toast .t1{font-weight:700}
.toast .t2{font-size:11.5px;color:var(--muted)}

/* ---------- mobile ---------- */
.tabs{display:none}
@media (max-width:1180px){ main{grid-template-columns:260px minmax(0,1fr) 340px} .trade{grid-template-columns:54px 120px 52px minmax(0,1fr) 96px 80px} .trade .links{display:none} }
@media (max-width:900px){
  header{gap:8px;padding:0 10px} .hide-m{display:none!important}
  main{display:block;height:calc(100% - 54px - 58px)}
  .panel{height:100%;display:none;border:0} .panel.show{display:flex}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .trade{grid-template-columns:44px 50px minmax(0,1fr) 84px;gap:8px;padding:9px 12px}
  .trade .c-wallet,.trade .c-mc,.trade .links{display:none}
  .thead{display:none}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;border-top:1px solid var(--line);background:#0a0b0f;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center}
  #toasts{right:auto;left:50%;transform:translateX(-50%);bottom:auto;top:62px}
  .tabs button.on{color:var(--green)}
  .tabs .bdg{font-family:var(--mono);font-size:10px;background:var(--green);color:#03140b;border-radius:999px;padding:0 6px;margin-left:4px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"></div>POISON <small class="hide-m">wallet radar</small></div>
  <div class="hstat" id="connStat" title="Live connection to Solana"><span class="dot" id="connDot"></span><span id="connTxt">Offline</span></div>
  <div class="hstat hide-m num" title="SOL price">◎ <span id="solPx">—</span></div>
  <div class="hstat hide-m num" title="Average time from on-chain confirmation to alert">⚡ <span id="lat">—</span></div>
  <div class="spacer"></div>
  <button class="btn demo hide-m" id="demoBtn" title="Simulated trades to preview the app">Demo</button>
  <button class="btn" id="soundBtn" title="Sound alerts">🔊</button>
  <button class="btn" id="notifBtn">🔔 <span class="hide-m">Enable alerts</span></button>
  <button class="btn" id="setBtn">⚙ <span class="hide-m">Settings</span></button>
</header>

<main>
  <!-- wallets -->
  <section class="panel show" id="pWallets">
    <div class="ph">Watchlist <span class="count" id="wCount">0</span><span class="spacer"></span><button class="btn sm" id="ioBtn">Import / Export</button></div>
    <form class="add" id="addForm" autocomplete="off">
      <input class="inp num" id="addAddr" placeholder="Solana wallet address" spellcheck="false" />
      <div class="row">
        <input class="inp" id="addLabel" placeholder="Label (e.g. Cupsey)" maxlength="24" />
        <select class="inp" id="addTag" style="width:110px">
          <option>Insider</option><option>Trader</option><option>KOL</option><option>Whale</option>
        </select>
      </div>
      <button class="btn pri" type="submit" style="justify-content:center">+ Track wallet</button>
    </form>
    <div class="chips" id="tagChips"></div>
    <div class="scroll" id="wList"></div>
  </section>

  <!-- feed -->
  <section class="panel" id="pFeed">
    <div class="kpis">
      <div class="kpi"><div class="l">Tracked</div><div class="v num" id="kW">0</div></div>
      <div class="kpi"><div class="l">Buys · 1h</div><div class="v num g" id="kB">0</div></div>
      <div class="kpi"><div class="l">Sells · 1h</div><div class="v num r" id="kS">0</div></div>
      <div class="kpi"><div class="l">Entry signals</div><div class="v num" id="kE">0</div></div>
    </div>
    <div class="feedbar">
      <button class="chip on" data-f="ALL">All</button>
      <button class="chip" data-f="BUY">Buys</button>
      <button class="chip" data-f="SELL">Sells</button>
      <span class="spacer"></span>
      <span class="muted" style="font-size:11.5px">Live feed</span>
    </div>
    <div class="trade thead"><span>Time</span><span class="c-wallet">Wallet</span><span>Side</span><span>Token</span><span style="text-align:right">Size</span><span class="c-mc" style="text-align:right">MCap</span><span></span></div>
    <div class="scroll" id="feed"></div>
  </section>

  <!-- signals -->
  <section class="panel" id="pSignals">
    <div class="ph">Entry signals <span class="count" id="sCount">0</span><span class="spacer"></span><span class="dim" style="text-transform:none;letter-spacing:0;font-weight:500" id="tickInfo"></span></div>
    <div class="scroll" id="sigs"></div>
  </section>
</main>

<nav class="tabs">
  <button data-p="pWallets" class="on">👛 Wallets</button>
  <button data-p="pFeed">⚡ Feed</button>
  <button data-p="pSignals">🎯 Signals<span class="bdg" id="tabBadge" hidden>0</span></button>
</nav>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer"><div class="dh" id="dHead"></div><div class="dbody" id="dBody"></div></aside>
<div id="toasts"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Constants & state
   ===================================================================== */
const WSOL = 'So11111111111111111111111111111111111111112';
const USD_MINTS = new Set(['EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v','Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB']);
const COLORS = ['#19e68c','#5aa9ff','#ffb547','#ff6ad5','#c478ff','#19e6c8','#ff8a00','#ff4d6a','#a3e635','#38bdf8'];
const TAGS = ['Insider','Trader','KOL','Whale'];
const FEED_MAX_DOM = 200, TRADES_MAX = 3000, LIVE_AGE_S = 150;

const DEFAULTS = {
  rpcHttp: 'https://api.mainnet-beta.solana.com',
  rpcWs: '',
  maxDrift: 15,       // % above insider entry still considered a good entry
  maxDip: -25,        // % below insider entry => treated as dumping
  minLiq: 10000,      // USD
  minMcap: 0, maxMcap: 0,
  minBuySol: 0.1,     // ignore dust buys
  threshold: 60,      // score needed for ENTER
  windowMin: 20,      // how long a signal stays live
  pollSec: 3,         // market refresh
  backfill: 25,       // past txs to load when a wallet is added
  link: 'dexscreener',
  nBuy: true, nSell: true, nEnter: true, sound: true,
};
const LINKS = {
  dexscreener: m => `https://dexscreener.com/solana/${m}`,
  gmgn:        m => `https://gmgn.ai/sol/token/${m}`,
  jupiter:     m => `https://jup.ag/swap/SOL-${m}`,
  birdeye:     m => `https://birdeye.so/token/${m}?chain=solana`,
  photon:      m => `https://photon-sol.tinyastro.io/en/lp/${m}`,
  bullx:       m => `https://neo.bullx.io/terminal?chainId=1399811149&address=${m}`,
};

const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const S = {
  wallets: load('pt.wallets', []),
  trades:  load('pt.trades', []),
  set:     Object.assign({}, DEFAULTS, load('pt.settings', {})),
  tokens:  {},                 // mint -> market meta
  signals: new Map(),          // mint -> signal
  seen:    new Set(),          // signatures processed
  solUsd:  load('pt.solUsd', 0),
  demo:    false,
  tagFilter: 'ALL', feedFilter: 'ALL',
  lat: [],
};
S.trades.forEach(t => S.seen.add(t.sig + t.wallet));

let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      localStorage.setItem('pt.wallets', JSON.stringify(S.wallets.filter(w => !w.demo)));
      localStorage.setItem('pt.trades', JSON.stringify(S.trades.filter(t => !t.demo).slice(0, TRADES_MAX)));
      localStorage.setItem('pt.settings', JSON.stringify(S.set));
      localStorage.setItem('pt.solUsd', JSON.stringify(S.solUsd));
    } catch {}
  }, 400);
}

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = a => a ? a.slice(0, 4) + '…' + a.slice(-4) : '';
const isAddr = a => /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);
const now = () => Date.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fmtUsd(v) {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return '$' + (v/1e3).toFixed(1) + 'K';
  return '$' + v.toFixed(a >= 10 ? 0 : 2);
}
function fmtPx(p) {
  if (p == null || !isFinite(p) || p <= 0) return '—';
  if (p >= 1) return '$' + p.toFixed(4);
  const s = p.toFixed(20); const m = s.match(/^0\.(0*)(\d{1,4})/);
  if (!m) return '$' + p.toPrecision(4);
  const z = m[1].length;
  return z >= 4 ? `$0.0<sub>${z}</sub>${m[2]}` : '$' + p.toPrecision(4).replace(/0+$/,'');
}
const fmtSol = v => (v == null || !isFinite(v)) ? '—' : (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3)) + ' ◎';
const fmtPct = v => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '') + v.toFixed(Math.abs(v) >= 100 ? 0 : 1) + '%';

  if (s < 86400) return Math.floor(s/3600) + 'h';

/* =====================================================================
   Solana RPC (HTTP) with a small concurrency-limited queue
   ===================================================================== */
let rid = 0;
async function rpc(method, params) {
  const r = await fetch(S.set.rpcHttp, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: ++rid, method, params }),
  });
  if (r.status === 429) throw Object.assign(new Error('rate limited'), { rl: true });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || 'rpc error');
  return j.result;
}
const queue = []; let active = 0; const CONC = 4;
function enqueue(job, priority) { priority ? queue.unshift(job) : queue.push(job); pump(); }
function pump() {
  while (active < CONC && queue.length) {
    const job = queue.shift(); active++;
    job().catch(() => {}).finally(() => { active--; pump(); });
  }
}

async function fetchTx(sig) {
  for (let i = 0; i < 6; i++) {
    try {
      const tx = await rpc('getTransaction', [sig, { encoding: 'jsonParsed', maxSupportedTransactionVersion: 0, commitment: 'confirmed' }]);
      if (tx) return tx;
    } catch (e) { if (!e.rl && i > 2) throw e; }
    await sleep(350 * (i + 1));
  }
  return null;
}

/* Turn a parsed transaction into a trade for a specific wallet */
function parseTrade(tx, wallet, sig) {
  if (!tx?.meta || tx.meta.err) return null;
  const keys = tx.transaction.message.accountKeys.map(k => typeof k === 'string' ? k : k.pubkey);
  const i = keys.indexOf(wallet);
  let sol = i >= 0 ? (tx.meta.postBalances[i] - tx.meta.preBalances[i]) / 1e9 : 0;
  if (i === 0) sol += (tx.meta.fee || 0) / 1e9;           // don't count network fee as trade size
  const d = {};
  const add = (b, sign) => {
    if (b.owner !== wallet) return;
    d[b.mint] = (d[b.mint] || 0) + sign * (b.uiTokenAmount.uiAmount ?? Number(b.uiTokenAmount.uiAmountString) ?? 0);
  };
  (tx.meta.preTokenBalances || []).forEach(b => add(b, -1));
  (tx.meta.postTokenBalances || []).forEach(b => add(b, +1));
  let usd = 0;
  if (d[WSOL]) { sol += d[WSOL]; delete d[WSOL]; }
  for (const m of USD_MINTS) if (d[m]) { usd += d[m]; delete d[m]; }
  const moved = Object.entries(d).filter(([, v]) => Math.abs(v) > 1e-9).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  if (!moved.length) return null;
  const quoteUsd = sol * (S.solUsd || 0) + usd;
  const [mint, amt] = moved.length === 1 ? moved[0]
    : (moved.find(([, v]) => v > 0) || moved[0]);          // token-to-token: focus on what was received
  let side;
  if (moved.length > 1 && moved.some(([, v]) => v > 0) && moved.some(([, v]) => v < 0)) side = 'SWAP';
  else if (amt > 0 && (sol < -0.0005 || usd < -0.01)) side = 'BUY';
  else if (amt < 0 && (sol > 0.0005 || usd > 0.01)) side = 'SELL';
  else side = amt > 0 ? 'IN' : 'OUT';
  const ts = tx.blockTime ? tx.blockTime * 1000 : now();
  const solAbs = Math.abs(sol) + (S.solUsd ? Math.abs(usd) / S.solUsd : 0);
  return {
    sig, wallet, side, mint, amount: Math.abs(amt),
    sol: (side === 'BUY' || side === 'SELL') ? solAbs : 0,
    usd: (side === 'BUY' || side === 'SELL') ? Math.abs(quoteUsd) : 0,
    price: (side === 'BUY' || side === 'SELL') && Math.abs(amt) > 0 ? Math.abs(quoteUsd) / Math.abs(amt) : 0,
    ts, detectedAt: now(),
  };
}

async function processSig(sig, wallet, live) {
  const key = sig + wallet;
  if (S.seen.has(key)) return;
  S.seen.add(key);
  let tx;
  try { tx = await fetchTx(sig); } catch { tx = null; }
  if (!tx) { S.seen.delete(key); return; }   // let the poller retry later
  const t = parseTrade(tx, wallet, sig);
  if (!t) return;
  ingest(t, live);
}

/* =====================================================================
   Live connection: one WebSocket, one logsSubscribe per wallet
   ===================================================================== */
const Live = {
  ws: null, subs: new Map(), pend: new Map(), bySub: new Map(), retry: 0, timer: null,
  url() {
    if (S.set.rpcWs) return S.set.rpcWs;
    return S.set.rpcHttp.replace(/^http/i, 'ws');
  },
  connect() {
    if (S.demo) return;
    clearTimeout(this.timer);
    try { this.ws && this.ws.close(); } catch {}
    this.subs.clear(); this.pend.clear(); this.bySub.clear();
    setConn('warn', 'Connecting…');
    let ws;
    try { ws = new WebSocket(this.url()); } catch { setConn('off', 'Bad WS URL'); return; }
    this.ws = ws;
    ws.onopen = () => {
      this.retry = 0;
      S.wallets.filter(w => !w.demo).forEach(w => this.sub(w.addr));
      setConn('on', 'Live');
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.id && this.pend.has(m.id)) {
        const addr = this.pend.get(m.id); this.pend.delete(m.id);
        if (typeof m.result === 'number') { this.subs.set(addr, m.result); this.bySub.set(m.result, addr); }
        return;
      }
      if (m.method === 'logsNotification') {
        const v = m.params.result.value, addr = this.bySub.get(m.params.subscription);
        if (!addr || v.err) return;
        enqueue(() => processSig(v.signature, addr, true), true);
      }
    };
    ws.onclose = () => {
      if (this.ws !== ws || S.demo) return;
      setConn('off', 'Reconnecting…');
      this.timer = setTimeout(() => this.connect(), Math.min(15000, 800 * 2 ** this.retry++));
    };
    ws.onerror = () => {};
  },
  sub(addr) {
    if (!this.ws || this.ws.readyState !== 1 || this.subs.has(addr)) return;
    const id = ++rid; this.pend.set(id, addr);
    this.ws.send(JSON.stringify({ jsonrpc: '2.0', id, method: 'logsSubscribe', params: [{ mentions: [addr] }, { commitment: 'confirmed' }] }));
  },
  unsub(addr) {
    const s = this.subs.get(addr); if (s == null) return;
    this.subs.delete(addr); this.bySub.delete(s);
    try { this.ws.send(JSON.stringify({ jsonrpc: '2.0', id: ++rid, method: 'logsUnsubscribe', params: [s] })); } catch {}
  },
  stop() { clearTimeout(this.timer); const w = this.ws; this.ws = null; try { w && w.close(); } catch {} },
};
function setConn(kind, txt) { $('connDot').className = 'dot ' + kind; $('connTxt').textContent = txt; }

/* Safety-net poller: round-robins wallets over HTTP in case a WS message is missed */
let rr = 0;
async function backstop() {
  const ws = S.wallets.filter(w => !w.demo);
  if (!S.demo && ws.length) {
    const w = ws[rr++ % ws.length];
    try {
      const sigs = await rpc('getSignaturesForAddress', [w.addr, { limit: 6, commitment: 'confirmed' }]);
      for (const s of sigs.reverse()) if (!s.err && !S.seen.has(s.signature + w.addr)) enqueue(() => processSig(s.signature, w.addr, true));
    } catch {}
  }
  setTimeout(backstop, Math.max(1500, 6000 / Math.max(1, ws.length)));
}

async function backfill(addr) {
  if (!S.set.backfill || S.demo) return;
  try {
    const sigs = await rpc('getSignaturesForAddress', [addr, { limit: +S.set.backfill }]);
    sigs.filter(s => !s.err).forEach(s => enqueue(() => processSig(s.signature, addr, false)));
  } catch (e) { toast('Backfill failed', e.message + ' — try a private RPC in Settings', ''); }
}

/* =====================================================================
   Ingest a trade -> feed, wallet stats, signals, alerts
   ===================================================================== */
function ingest(t, live) {
  const w = walletBy(t.wallet); if (!w) return;
  if (S.demo) t.demo = true;
  S.trades.unshift(t);
  if (S.trades.length > TRADES_MAX) S.trades.length = TRADES_MAX;
  S.trades.sort((a, b) => b.ts - a.ts);
  save();
  const fresh = live && (now() - t.ts) / 1000 < LIVE_AGE_S;
  if (fresh) {
    const l = t.detectedAt - t.ts; if (l > 0 && l < 60000) { S.lat.push(l); if (S.lat.length > 30) S.lat.shift(); }
    const avg = S.lat.reduce((a, b) => a + b, 0) / (S.lat.length || 1);
    $('lat').textContent = S.lat.length ? (avg / 1000).toFixed(1) + 's' : '—';
  }
  if (!S.tokens[t.mint]) needMeta(t.mint);
  addFeedRow(t, fresh);
  flashWallet(t.wallet);

  if (!fresh) return;
  if (t.side === 'BUY' || t.side === 'SWAP') onBuy(t, w);
  if (t.side === 'SELL') onSell(t, w);
}

function onBuy(t, w) {
  if (t.side === 'BUY' && t.sol < +S.set.minBuySol) return;
  let s = S.signals.get(t.mint);
  if (!s) {
    s = { mint: t.mint, first: t.ts, ref: t.price || 0, wallets: new Map(), samples: [], state: 'NEW', score: 0, reasons: [], notified: 0, everEnter: false };
    S.signals.set(t.mint, s);
  }
  const prev = s.wallets.get(t.wallet) || { sol: 0, amt: 0, sold: 0, ts: t.ts };
  prev.sol += t.sol; prev.amt += t.amount; s.wallets.set(t.wallet, prev);
  if (!s.ref && t.price) s.ref = t.price;
  s.expires = now() + S.set.windowMin * 60000;
  if (S.set.nBuy) alert_({
    kind: 'BUY', mint: t.mint,
    title: `${w.label} bought ${tokSym(t.mint)}`,
    body: `${fmtSol(t.sol)} (${fmtUsd(t.usd)}) · ${s.wallets.size > 1 ? s.wallets.size + ' tracked wallets in' : w.tag}`,
  });
  tickMarket(true);
}

function onSell(t, w) {
  const s = S.signals.get(t.mint);
  if (s && s.wallets.has(t.wallet)) {
    const p = s.wallets.get(t.wallet);
    p.sold += t.amount;
  }
  if (S.set.nSell) {
    const pos = position(t.wallet, t.mint);
    const pct = pos.bought > 0 ? Math.min(100, (t.amount / pos.bought) * 100) : null;
    alert_({ kind: 'SELL', mint: t.mint, title: `${w.label} sold ${tokSym(t.mint)}`,
      body: `${pct ? pct.toFixed(0) + '% of bag · ' : ''}${fmtSol(t.sol)} (${fmtUsd(t.usd)}) — consider taking profit` });
  }
  renderSignals();
}

/* =====================================================================
   Entry scoring: is NOW a good time to follow?
   ===================================================================== */
function evaluate(s) {
  const m = S.tokens[s.mint] || {};
  const R = [], set = S.set;
  const p = m.price || 0;
  if (!s.ref && p) s.ref = p;
  if (p) { s.samples.push([now(), p]); if (s.samples.length > 240) s.samples.shift(); }
  const drift = s.ref && p ? (p / s.ref - 1) * 100 : null;
  s.drift = drift;
  const holders = [...s.wallets.values()];
  const holding = holders.filter(h => h.sold < h.amt * 0.7).length;
  const ageMin = (now() - s.first) / 60000;
  const pressure = (m.b5 + m.s5) ? m.b5 / (m.b5 + m.s5) : null;
  let sc = 0;

  // 1. price vs insider entry (35)
  let pts = 0;
  if (drift == null) pts = 15;
  else if (drift < set.maxDip) pts = 0;
  else if (drift <= 5) pts = 35;
  else if (drift <= set.maxDrift) pts = 25;
  else if (drift <= set.maxDrift * 2) pts = 8;
  sc += pts;
  R.push([drift != null && drift <= set.maxDrift && drift >= set.maxDip, `Price ${fmtPct(drift)} vs insider entry (zone ${set.maxDip}% … +${set.maxDrift}%)`]);
  // 2. liquidity (15)
  const liqOk = m.liq >= set.minLiq; if (liqOk) sc += 15;
  R.push([liqOk, `Liquidity ${fmtUsd(m.liq)} (min ${fmtUsd(+set.minLiq)})`]);
  // 3. buy pressure last 5m (15)
  if (pressure != null) { if (pressure >= .55) sc += 15; else if (pressure >= .45) sc += 8; }
  R.push([pressure != null && pressure >= .5, `Buy pressure 5m ${pressure == null ? '—' : Math.round(pressure * 100) + '%'} (${m.b5 || 0}B / ${m.s5 || 0}S)`]);
  // 4. confluence (15)
  const n = s.wallets.size; sc += n >= 3 ? 15 : n === 2 ? 10 : 0;
  R.push([n >= 2, `${n} tracked wallet${n > 1 ? 's' : ''} in`]);
  // 5. still holding (10)
  if (holding === n) sc += 10; else if (holding) sc += 4;
  R.push([holding > 0, holding === n ? 'Insider still holding' : `${n - holding}/${n} sold`]);
  // 6. freshness (5)
  if (ageMin < 3) sc += 5; else if (ageMin < 8) sc += 2;
  // 7. wallet quality (5)
  const best = Math.max(...[...s.wallets.keys()].map(a => walletStats(a).winRate ?? 0));
  if (best >= 55) sc += 5;
  s.score = Math.round(sc); s.reasons = R; s.meta = m;

  let st;
  const mcOk = (!+set.minMcap || m.mcap >= +set.minMcap) && (!+set.maxMcap || m.mcap <= +set.maxMcap);
  if (now() > s.expires) st = 'EXPIRED';
  else if (!holding) st = 'EXITED';
  else if (m.missing || (p && !liqOk) || (p && !mcOk)) st = 'AVOID';
  else if (drift != null && drift < set.maxDip) st = 'DUMPING';
  else if (drift != null && drift > set.maxDrift) st = 'LATE';
  else if (s.score >= set.threshold && p) st = 'ENTER';
  else st = 'WATCH';

  if (st === 'ENTER' && s.state !== 'ENTER' && now() - s.notified > 45000) {
    s.notified = now();
    const names = [...s.wallets.keys()].map(a => walletBy(a)?.label || short(a)).join(', ');
    if (S.set.nEnter) alert_({
      kind: 'ENTER', mint: s.mint,
      title: `🟢 ENTER ${tokSym(s.mint)} — score ${s.score}`,
      body: `${s.everEnter ? 'Pulled back into zone. ' : ''}${names} in @ ${stripTags(fmtPx(s.ref))} · now ${fmtPct(drift)} · MC ${fmtUsd(m.mcap)}`,
    });
    s.everEnter = true;
  }
  s.state = st;
}
const stripTags = h => h.replace(/<sub>(\d+)<\/sub>/, (_, z) => [...z].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('')).replace(/<[^>]+>/g, '');

/* =====================================================================
   Analytics
   ===================================================================== */
function position(addr, mint) {
  let bought = 0, sold = 0, buySol = 0, sellSol = 0, first = 0, last = 0;
  for (const t of S.trades) {
    if (t.wallet !== addr || t.mint !== mint) continue;
    if (t.side === 'BUY' || t.side === 'SWAP' || t.side === 'IN') { bought += t.amount; buySol += t.sol; }
    else if (t.side === 'SELL' || t.side === 'OUT') { sold += t.amount; sellSol += t.sol; }
    first = first ? Math.min(first, t.ts) : t.ts; last = Math.max(last, t.ts);
  }
  return { bought, sold, buySol, sellSol, first, last };
}
const statCache = new Map();
function walletStats(addr) {
  const hit = statCache.get(addr); if (hit && hit.n === S.trades.length) return hit.v;
  const per = new Map(); let n = 0, lastTs = 0, buys = 0, buySum = 0;
  for (const t of S.trades) {
    if (t.wallet !== addr) continue; n++; lastTs = Math.max(lastTs, t.ts);
    if (t.side === 'BUY') { buys++; buySum += t.sol; }
    if (!per.has(t.mint)) per.set(t.mint, position(addr, t.mint));
  }
  let realized = 0, wins = 0, closed = 0, open = 0, unreal = 0;
  const rows = [];
  for (const [mint, p] of per) {
    const frac = p.bought > 0 ? Math.min(1, p.sold / p.bought) : (p.sold > 0 ? 1 : 0);
    const r = p.sellSol - p.buySol * frac;
    if (p.sold > 0 && p.buySol > 0) { realized += r; if (frac >= 0.9) { closed++; if (r > 0) wins++; } }
    const remaining = Math.max(0, p.bought - p.sold);
    const px = S.tokens[mint]?.price;
    const u = remaining > 0 && px && S.solUsd ? remaining * px / S.solUsd - p.buySol * (1 - frac) : null;
    if (remaining > 0 && frac < 0.9 && p.buySol > 0) { open++; if (u != null) unreal += u; }
    rows.push({ mint, ...p, realized: p.buySol > 0 && p.sold > 0 ? r : null, unreal: u, status: frac >= 0.9 ? 'closed' : 'open' });
  }
  rows.sort((a, b) => b.last - a.last);
  const v = { n, buys, avgBuy: buys ? buySum / buys : 0, realized, winRate: closed ? wins / closed * 100 : null, closed, open, unreal, lastTs, rows };
  statCache.set(addr, { n: S.trades.length, v });
  return v;
}

function spark(samples, ref) {
  if (samples.length < 2) return `<svg class="spark" viewBox="0 0 300 46"></svg>`;
  const ps = samples.map(s => s[1]); const all = ref ? ps.concat(ref) : ps;
  let lo = Math.min(...all), hi = Math.max(...all); if (hi === lo) { hi *= 1.001; lo *= 0.999; }
  const t0 = samples[0][0], t1 = samples[samples.length - 1][0] || t0 + 1;
  const X = t => ((t - t0) / Math.max(1, t1 - t0)) * 300, Y = p => 42 - ((p - lo) / (hi - lo)) * 38;
  const pts = samples.map(s => X(s[0]).toFixed(1) + ',' + Y(s[1]).toFixed(1)).join(' ');
  const up = ps[ps.length - 1] >= (ref || ps[0]);
  const c = up ? 'var(--green)' : 'var(--red)';
  const zoneTop = ref ? Y(ref * (1 + S.set.maxDrift / 100)) : 0, zoneBot = ref ? Y(ref) : 0;
  return `<svg class="spark" viewBox="0 0 300 46" preserveAspectRatio="none">
    ${ref ? `<rect x="0" y="${Math.max(0, Math.min(zoneTop, 46))}" width="300" height="${Math.max(0, Math.min(46, zoneBot) - Math.max(0, zoneTop))}" fill="rgba(25,230,140,.07)"/>
    <line x1="0" x2="300" y1="${zoneBot}" y2="${zoneBot}" stroke="var(--dim)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>` : ''}
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function pnlCurve(addr) {
  const ts = S.trades.filter(t => t.wallet === addr && (t.side === 'BUY' || t.side === 'SELL')).slice().reverse();
  let c = 0; const pts = [[0, 0]];
  ts.forEach((t, i) => { c += t.side === 'SELL' ? t.sol : -t.sol; pts.push([i + 1, c]); });
  if (pts.length < 3) return '<div class="muted" style="font-size:12px">Not enough trades yet.</div>';
  const ys = pts.map(p => p[1]); let lo = Math.min(...ys, 0), hi = Math.max(...ys, 0); if (hi === lo) hi = lo + 1;
  const X = i => i / (pts.length - 1) * 500, Y = v => 76 - (v - lo) / (hi - lo) * 72;
  const line = pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 500 80" preserveAspectRatio="none" style="width:100%;height:90px">
    <line x1="0" x2="500" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--dim)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
    <polyline points="${line}" fill="none" stroke="${c >= 0 ? 'var(--green)' : 'var(--red)'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="muted" style="font-size:11px">Net SOL flow over the last ${ts.length} tracked buys/sells (includes still-open positions).</div>`;
}

}

  B58: '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz',
  addr() { let s = ''; for (let i = 0; i < 44; i++) s += this.B58[Math.random() * 58 | 0]; return s; },
  names: [['GOAT','Goatseus'],['FROG','Frog Nation'],['CHAD','Gigachad'],['MOON','To The Moon'],['DOGE2','Doge Two'],['PEPE','Pepe Sol'],['WIF','Hat Dog'],['BONKX','Bonk X']],
  start() {
    if (!S.wallets.length || S.wallets.every(w => w.demo)) {
      [['Insider #1','Insider'],['Cupsey-like','Trader'],['KOL Alpha','KOL'],['Dev Wallet','Insider']].forEach(([l, t], i) =>
        S.wallets.push({ addr: this.addr(), label: l, tag: t, color: COLORS[i], demo: true, addedAt: now() }));
    }
    this.names.forEach(([sym, name]) => { const m = this.addr(); this.toks[m] = { sym, name, p: 0.00001 + Math.random() * 0.002, liq: 8000 + Math.random() * 120000, sup: 1e9, b: 10, s: 8 }; });
    const loop = () => { this.trade(); this.timer = setTimeout(loop, 1800 + Math.random() * 3500); };
    loop(); this.trade(); this.trade();
  },
  stop() { clearTimeout(this.timer); S.wallets = S.wallets.filter(w => !w.demo); S.trades = S.trades.filter(t => !t.demo); S.signals.clear(); this.toks = {}; },
  trade() {
    const ws = S.wallets; if (!ws.length) return;
    const mints = Object.keys(this.toks);
    const hot = [...S.signals.keys()].filter(m => this.toks[m]);
    const mint = hot.length && Math.random() < 0.55 ? hot[Math.random() * hot.length | 0] : mints[Math.random() * mints.length | 0];
    const w = ws[Math.random() * ws.length | 0], tk = this.toks[mint];
    const holding = S.trades.some(t => t.wallet === w.addr && t.mint === mint && t.side === 'BUY' && t.demo);
    const side = holding && Math.random() < 0.35 ? 'SELL' : 'BUY';
    const sol = +(0.2 + Math.random() * (w.tag === 'Whale' ? 40 : 6)).toFixed(3);
    const usd = sol * S.solUsd;
    if (side === 'BUY') { tk.p *= 1 + Math.random() * 0.04; tk.b += 3; } else { tk.p *= 1 - Math.random() * 0.05; tk.s += 3; }
    const ts = now() - 400 - Math.random() * 900;
    ingest({ sig: this.addr() + this.addr().slice(0, 40), wallet: w.addr, side, mint, amount: usd / tk.p, sol, usd, price: tk.p, ts, detectedAt: now(), demo: true }, true);
  },
  market(mints) {
    for (const m of mints) {
      const tk = this.toks[m]; if (!tk) continue;
      tk.p *= 1 + (Math.random() - 0.47) * 0.035; tk.b += Math.random() * 4 | 0; tk.s += Math.random() * 4 | 0;
      S.tokens[m] = { symbol: tk.sym, name: tk.name, price: tk.p, liq: tk.liq, mcap: tk.p * tk.sup, b5: tk.b, s5: tk.s, at: now() };
    }
  },
};
function setDemo(on) {
  if (on === S.demo) return;
  S.demo = on;
  if (on) {
    Live.stop(); setConn('warn', 'Demo'); refreshSol(); Demo.start();
    Object.keys(Demo.toks).forEach(m => Demo.market([m]));
  } else { Demo.stop(); Live.connect(); }
  statCache.clear(); syncBtns(); renderWallets(); renderFeed(); renderSignals(); renderKpis();
}

/* =====================================================================
   Wiring
   ===================================================================== */
function syncBtns() {
  $('soundBtn').textContent = S.set.sound ? '🔊' : '🔇';
  $('demoBtn').classList.toggle('on', S.demo);
  const perm = 'Notification' in window ? Notification.permission : 'denied';
  $('notifBtn').classList.toggle('on', perm === 'granted');
  $('notifBtn').innerHTML = perm === 'granted' ? '🔔 <span class="hide-m">Alerts on</span>' : '🔔 <span class="hide-m">Enable alerts</span>';
}
$('soundBtn').onclick = () => { S.set.sound = !S.set.sound; save(); syncBtns(); if (S.set.sound) beep('BUY'); };
$('demoBtn').onclick = () => setDemo(!S.demo);
$('setBtn').onclick = showSettings;
$('ioBtn').onclick = showIO;
$('notifBtn').onclick = async () => {
  if (!('Notification' in window)) return toast('Not supported', 'This browser has no notifications — sound + on-screen alerts still work', '');
  const p = await Notification.requestPermission(); syncBtns();
  if (p === 'granted') { beep('ENTER'); toast('Alerts enabled', 'You will be pinged when a tracked wallet gives a good entry', 'ENTER'); }
};
$('tagChips').onclick = e => { const t = e.target.dataset.t; if (!t) return; S.tagFilter = t; renderChips(); renderWallets(); renderFeed(); };
document.querySelector('.feedbar').onclick = e => {
  const f = e.target.dataset.f; if (!f) return; S.feedFilter = f;
  document.querySelectorAll('.feedbar .chip').forEach(c => c.classList.toggle('on', c.dataset.f === f)); renderFeed();
};
$('wList').onclick = e => { const el = e.target.closest('.wallet'); if (el) showWallet(el.dataset.w); };
$('sigs').onclick = e => {
  const c = e.target.dataset.copy, d = e.target.dataset.dismiss;
  if (c) { navigator.clipboard?.writeText(c); toast('Contract copied', c, ''); }
  if (d) { S.signals.delete(d); renderSignals(); }
};
document.querySelector('.tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('show', p.id === b.dataset.p));
};
// unlock audio on first interaction (browsers block autoplay)
addEventListener('pointerdown', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }, { once: true });

// one cheap timer for "x seconds ago" labels
setInterval(() => document.querySelectorAll('.ago').forEach(el => el.textContent = ago(+el.dataset.ts)), 1000);

let marketT;
function restartMarket() { clearInterval(marketT); marketT = setInterval(() => tickMarket(), Math.max(1, +S.set.pollSec) * 1000); }

/* boot */
renderChips(); syncBtns(); renderWallets(); renderFeed(); renderSignals(); renderKpis();
refreshSol().then(() => {
  const mints = [...new Set(S.trades.slice(0, 120).map(t => t.mint))];
  if (mints.length) fetchMarket(mints).then(() => { renderFeed(); renderWallets(); });
});
setInterval(refreshSol, 30000);
restartMarket();
if (new URLSearchParams(location.search).has('demo')) setDemo(true);
else Live.connect();
setTimeout(backstop, 3000);
})();
</script>
</body>
</html>
