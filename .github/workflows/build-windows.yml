name: Build POISON Client (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['launcher/**', 'mod/**', '.github/workflows/build-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: node scripts/prepare-mods.js   # builds ../mod and fetches Fabric API into build/mods
      - run: npx electron-builder --win portable nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: POISON-Client-windows
          path: |
            launcher/dist/*.exe
