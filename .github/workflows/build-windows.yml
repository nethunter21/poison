name: Build Windows EXE

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer + portable exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PoisonTerminal-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Poison Terminal build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            **Poison Terminal for Windows**
            - `PoisonTerminal-Setup-*.exe` — installer (Start menu + desktop shortcut)
            - `PoisonTerminal-*-portable.exe` — single file, no install, just run it

            Windows SmartScreen may warn because the exe is not code-signed: click **More info → Run anyway**.
          files: dist/*.exe
